<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login • HealthPass</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <style>
    body { background: #0f172a; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; margin: 0; }
    .login-card { background: #1e293b; padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); color: #fff; }
    .login-card h1 { color: #2dd4bf; margin-top: 0; text-align: center; }
    .field { background: #334155; border: 1px solid #475569; color: #fff; padding: 12px; border-radius: 8px; width: 100%; margin-bottom: 16px; box-sizing: border-box; }
    .field:focus { outline: none; border-color: #2dd4bf; }
    .btn { background: #2dd4bf; color: #0f172a; font-weight: bold; border: none; padding: 14px; border-radius: 8px; width: 100%; cursor: pointer; }
    .btn:hover { background: #14b8a6; }
    #err { background: #ef4444; color: #fff; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 16px; display: none; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>HealthPass Portal</h1>
    <p style="text-align: center; color: #94a3b8; margin-bottom: 24px;">Secure access for Admins & Clinic Admins</p>
    
    <div id="err"></div>
    
    <form id="f">
      <input class="field" id="u" type="text" placeholder="Username" required>
      <input class="field" id="p" type="password" placeholder="Password" required>
      <button class="btn" type="submit">Log In</button>
    </form>
    
    <p style="text-align: center; font-size: 12px; color: #64748b; margin-top: 20px;">
      Main Admin: admin / admin123<br>
      Clinic Admin: phc0142 / clinic123
    </p>
  </div>

  <script>
    document.getElementById('f').onsubmit = async function(e) {
      e.preventDefault();
      const errEl = document.getElementById('err');
      const btn = document.querySelector('.btn');
      
      errEl.style.display = 'none';
      btn.textContent = 'Logging in...';

      try {
        // 1. Send credentials to backend
        const res = await fetch('/api/auth/portal/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            username: document.getElementById('u').value, 
            password: document.getElementById('p').value 
          })
        });
        
        const data = await res.json();
        
        if (res.ok && data.token) {
          // 2. Save the token
          localStorage.setItem('token', data.token); 
          
          // 3. Redirect based on the role returned by the backend
          if (data.role === 'admin') {
            window.location.href = 'index.html'; // Main Admin
          } else if (data.role === 'subadmin') {
            window.location.href = 'clinic-dashboard.html'; // Clinic Admin
          } else {
            throw new Error('You do not have permission to access this portal.');
          }
        } else {
          throw new Error(data.message || 'Login failed');
        }
      } catch (error) {
        errEl.textContent = error.message;
        errEl.style.display = 'block';
        btn.textContent = 'Log In';
      }
    };
  </script>
</body>
</html>
